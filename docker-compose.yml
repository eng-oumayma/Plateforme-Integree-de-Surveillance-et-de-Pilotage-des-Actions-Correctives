# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB:       leoni_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: root1234
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout:  5s
      retries:  5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    # .env situé dans backend/.env
    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:80"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  postgres_data:
    # ← Si tu veux réutiliser les données existantes
    # external: true
    # name: postgres-db_data