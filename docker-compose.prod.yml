# docker-compose.prod.yml
version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB:       leoni_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASS}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout:  5s
      retries:  5
    restart: unless-stopped

  backend:
    image: ${ECR_REGISTRY}/leoni-hsee-backend:${IMAGE_TAG}
    container_name: hsee-backend
    ports: ["3000:3000"]
    environment:
      DB_HOST:    postgres
      DB_PORT:    "5432"
      DB_NAME:    leoni_db
      DB_USER:    postgres
      DB_PASS:    ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV:   production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/leoni-hsee-frontend:${IMAGE_TAG}
    container_name: hsee-frontend
    ports: ["80:80"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  postgres_data: