name: LEONI HSEE CI/CD

on:
  push:
    branches:
      - develop-clean
      - main

  pull_request:
    branches:
      - develop-clean
      - main

jobs:
  # ============================================================
  # 1. BUILD
  # ============================================================
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- BACKEND ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist

      # ---------------- FRONTEND ----------------
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  # ============================================================
  # 2. TESTING
  # ============================================================
  Testing:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: backend
        run: npm test --if-present

  # ============================================================
  # 3. SECURITY SCAN
  # ============================================================
  Security_Scan:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: 0
          output: trivy-results.json

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json

  # ============================================================
  # 4. BUILD & PUSH DOCKER IMAGES TO ECR
  # ============================================================
  BUILD_AND_PUBLISH:
    runs-on: ubuntu-latest

    needs:
      - Build
      - Testing
      - Security_Scan

    # Currently deploying from develop-clean
    if: github.ref == 'refs/heads/develop-clean'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- AWS ----------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------------- ECR LOGIN ----------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ========================================================
      # BACKEND
      # ========================================================
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-backend:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-backend:latest \
            ./backend

      - name: Push Backend Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-backend:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-backend:latest

      # ========================================================
      # FRONTEND
      # ========================================================
      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-frontend:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-frontend:latest \
            ./frontend

      - name: Push Frontend Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-frontend:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-frontend:latest

  # ============================================================
  # 5. DEPLOY TO EC2
  # ============================================================
  Deploy:
    runs-on: ubuntu-latest

    needs: BUILD_AND_PUBLISH

    # Currently deploying from develop-clean
    if: github.ref == 'refs/heads/develop-clean'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "================================="
            echo "Starting LEONI deployment"
            echo "================================="

            cd /home/ec2-user/leoni-hsee

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password \
              --region ${{ secrets.AWS_REGION }} \
              | docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.ECR_REGISTRY }}

            echo "Pulling latest backend image..."

            docker pull \
              ${{ secrets.ECR_REGISTRY }}/leoni-hsee-backend:latest

            echo "Pulling latest frontend image..."

            docker pull \
              ${{ secrets.ECR_REGISTRY }}/leoni-hsee-frontend:latest

            echo "Starting PostgreSQL..."

            docker compose \
              -f docker-compose.prod.yml \
              up -d postgres

            echo "Starting backend and frontend..."

            docker compose \
              -f docker-compose.prod.yml \
              up -d \
              --no-deps \
              --force-recreate \
              backend frontend

            echo "Removing unused Docker images..."

            docker image prune -af

            echo "================================="
            echo "Deployment completed"
            echo "================================="

            docker compose \
              -f docker-compose.prod.yml \
              ps
