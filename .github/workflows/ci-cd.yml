name: LEONI HSEE — CI/CD Pipeline

on:
  push:
    branches:
      - develop-clean
      - main

  pull_request:
    branches:
      - develop-clean
      - main

  workflow_dispatch:

env:
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  BACKEND_REPOSITORY: leoni-hsee-backend
  FRONTEND_REPOSITORY: leoni-hsee-frontend

permissions:
  contents: read

jobs:
  # =====================================================
  # Job 1 : Build
  # =====================================================
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---------- Backend ----------
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/

      # ---------- Frontend ----------
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Build Failure
        if: failure()
        run: echo "🚨 Build failed!"

  # =====================================================
  # Job 2 : Testing
  # =====================================================
  Testing:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm run test --if-present

      - name: Tests Finished
        run: echo "✅ Tests completed"

  # =====================================================
  # Job 3 : Security Scan
  # =====================================================
  Security_Scan:
  runs-on: ubuntu-latest
  needs: Build

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Trivy Security Scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        format: json
        exit-code: 0
        output: trivy-results.json

    - name: Upload Trivy Results
      uses: actions/upload-artifact@v4
      with:
        name: trivy-results
        path: trivy-results.json

  # =====================================================
  # Job 4 : Build Docker + Push ECR
  # Seulement sur main
  # =====================================================
  BUILD_AND_PUBLISH:
    runs-on: ubuntu-latest

    needs:
      - Build
      - Testing
      - Security_Scan

    if: github.ref == 'refs/heads/main'

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- AWS ----------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------- ECR ----------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ---------- Backend Docker ----------
      - name: Build Backend Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$BACKEND_REPOSITORY:latest \
            ./backend

      - name: Push Backend Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:latest

      # ---------- Frontend Docker ----------
      - name: Build Frontend Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest \
            ./frontend

      - name: Push Frontend Docker Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest

  # =====================================================
  # Job 5 : Deploy sur EC2
  # Seulement sur main
  # =====================================================
  Deploy:
    runs-on: ubuntu-latest

    needs:
      - BUILD_AND_PUBLISH

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

          DB_PASS: ${{ secrets.DB_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

          BACKEND_REPOSITORY: leoni-hsee-backend
          FRONTEND_REPOSITORY: leoni-hsee-frontend

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: >
            ECR_REGISTRY,
            IMAGE_TAG,
            AWS_REGION,
            DB_PASS,
            JWT_SECRET,
            AWS_ACCESS_KEY_ID,
            AWS_SECRET_ACCESS_KEY,
            AWS_SESSION_TOKEN,
            BACKEND_REPOSITORY,
            FRONTEND_REPOSITORY

          timeout: 120s

          script: |

            set -e

            echo "======================================"
            echo "🚀 Starting deployment"
            echo "======================================"

            # =================================================
            # AWS CONFIGURATION
            # =================================================

            echo "🔐 Configuring AWS..."

            aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"

            aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"

            aws configure set aws_session_token "$AWS_SESSION_TOKEN"

            aws configure set region "$AWS_REGION"


            # =================================================
            # LOGIN TO ECR
            # =================================================

            echo "🔑 Login to Amazon ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" \
              | docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"


            # =================================================
            # PROJECT DIRECTORY
            # =================================================

            echo "📂 Accessing project directory..."

            cd /home/ec2-user/leoni-hsee


            # =================================================
            # PULL NEW DOCKER IMAGES
            # =================================================

            echo "📥 Pulling backend image..."

            docker pull \
              "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"


            echo "📥 Pulling frontend image..."

            docker pull \
              "$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"


            # =================================================
            # START POSTGRESQL
            # =================================================

            echo "🐘 Starting PostgreSQL..."

            docker-compose \
              -f docker-compose.prod.yml \
              up -d postgres

            sleep 15


            # =================================================
            # RESTART BACKEND + FRONTEND
            # =================================================

            echo "🔄 Restarting backend and frontend..."

            docker-compose \
              -f docker-compose.prod.yml \
              up -d \
              --no-deps \
              --force-recreate \
              backend frontend


            # =================================================
            # CLEAN OLD IMAGES
            # =================================================

            echo "🧹 Cleaning old Docker images..."

            docker image prune -f


            # =================================================
            # CHECK CONTAINERS
            # =================================================

            echo "📊 Container status..."

            docker-compose \
              -f docker-compose.prod.yml \
              ps


            # =================================================
            # FINISH
            # =================================================

            echo "======================================"
            echo "✅ Deployment completed successfully"
            echo "======================================"

            echo "🌐 Application:"
            echo "http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)"
