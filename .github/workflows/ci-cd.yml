name: LEONI HSEE — CI/CD Pipeline

on:
  push:
    branches: [develop-clean]
  pull_request:
    branches: [develop-clean]
  workflow_dispatch:

env:
  ECR_REGISTRY:        ${{ secrets.ECR_REGISTRY }}
  BACKEND_REPOSITORY:  leoni-hsee-backend
  FRONTEND_REPOSITORY: leoni-hsee-frontend

permissions:
  contents: read

jobs:
  # ── Job 1 : Build ────────────────────────────────────
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
        - name: Build Backend
        working-directory: ./backend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: backend-dist, path: backend/dist/ }
      - name: Build Frontend
        working-directory: ./frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist/ }
      - if: failure()
        run: echo "🚨 Build failed!"

  # ── Job 2 : Testing ──────────────────────────────────
  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - if: github.ref == 'refs/heads/main'
        working-directory: ./backend
        run: npm ci && npm run test --if-present
      - if: github.ref != 'refs/heads/main'
      run: echo "⏭️ Skipping tests"

  # ── Job 3 : Security Scan ────────────────────────────
  Security_Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type:  fs
          scan-ref:   .
          format:     json
          exit-code:  0
          output:     trivy-results.json
      - uses: actions/upload-artifact@v4
        with: { name: trivy-results, path: trivy-results.json }

  # ── Job 4 : Build & Push ECR ─────────────────────────
  BUILD_AND_PUBLISH:
    runs-on: ubuntu-latest
    environment: production
    needs: [Build, Testing, Security_Scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & Push Backend
        env: { IMAGE_TAG: "${{ github.sha }}" }
        run: |
          docker build             -t $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG             -t $ECR_REGISTRY/$BACKEND_REPOSITORY:latest             ./backend
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$BACKEND_REPOSITORY:latest
      - name: Build & Push Frontend
        env: { IMAGE_TAG: "${{ github.sha }}" }
        run: |
          docker build             -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG             -t $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest             ./frontend
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$FRONTEND_REPOSITORY:latest
          # ── Job 5 : Deploy sur EC2 ───────────────────────────
  Deploy:
    runs-on: ubuntu-latest
    needs: BUILD_AND_PUBLISH
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY:          ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG:             ${{ github.sha }}
          AWS_REGION:            ${{ secrets.AWS_REGION }}
          DB_PASS:               ${{ secrets.DB_PASS }}
          JWT_SECRET:            ${{ secrets.JWT_SECRET }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
          BACKEND_REPOSITORY:    leoni-hsee-backend
          FRONTEND_REPOSITORY:   leoni-hsee-frontend
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          envs:     ECR_REGISTRY,IMAGE_TAG,AWS_REGION,DB_PASS,JWT_SECRET,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,BACKEND_REPOSITORY,FRONTEND_REPOSITORY
          timeout:  120s
          script: |
            set -e
            # Login ECR
            aws configure set aws_access_key_id     $AWS_ACCESS_KEY_ID
            aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
            aws configure set aws_session_token     $AWS_SESSION_TOKEN
            aws configure set region                $AWS_REGION
            aws ecr get-login-password --region $AWS_REGION |               docker login --username AWS --password-stdin $ECR_REGISTRY
            # Aller dans le dossier projet
            cd /home/ec2-user/leoni-hsee
            # Pull nouvelles images
            docker pull $ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG
            docker pull $ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG
            # Démarrer postgres si absent
            docker-compose -f docker-compose.prod.yml up -d postgres
            sleep 15
            # Relancer backend + frontend
            docker-compose -f docker-compose.prod.yml up -d               --no-deps --force-recreate backend frontend
            # Nettoyer anciennes images
            docker image prune -f
            docker-compose -f docker-compose.prod.yml ps
            echo "✅ Déploiement terminé"
            echo "🌐 http://$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)"