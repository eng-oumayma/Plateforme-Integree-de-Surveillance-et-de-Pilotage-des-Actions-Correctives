name: LEONI HSEE CI/CD

on:
  push:
    branches:
      - develop-clean
      - main

  pull_request:
    branches:
      - develop-clean
      - main

# ============================================================
# BUILD
# ============================================================

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------------- BACKEND ----------------

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist

      # ---------------- FRONTEND ----------------

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  # ============================================================
  # TESTING
  # ============================================================

  Testing:
    runs-on: ubuntu-latest

    needs:
      - Build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: backend
        run: npm test --if-present

  # ============================================================
  # SECURITY SCAN
  # ============================================================

  Security_Scan:
    runs-on: ubuntu-latest

    needs:
      - Build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: 0
          output: trivy-results.json

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4

        with:
          name: trivy-results
          path: trivy-results.json

  # ============================================================
  # BUILD DOCKER + PUSH ECR
  # ============================================================

  BUILD_AND_PUBLISH:
    runs-on: ubuntu-latest

    needs:
      - Build
      - Testing
      - Security_Scan

    if: github.ref == 'refs/heads/develop-clean'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- AWS ----------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------------- AWS TEST ----------------

      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # ---------------- ECR LOGIN ----------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ========================================================
      # BACKEND DOCKER
      # ========================================================

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-backend:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-backend:latest \
            ./backend

      - name: Push Backend Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-backend:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-backend:latest

      # ========================================================
      # FRONTEND DOCKER
      # ========================================================

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-frontend:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-frontend:latest \
            ./frontend

      - name: Push Frontend Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-frontend:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/leoni-hsee-frontend:latest

  # ============================================================
  # DEPLOY EC2
  # ============================================================

  Deploy:
    runs-on: ubuntu-latest

    needs:
      - BUILD_AND_PUBLISH

    if: github.ref == 'refs/heads/develop-clean'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

          AWS_REGION: ${{ secrets.AWS_REGION }}

          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

        with:
          host: ${{ secrets.EC2_HOST }}

          username: ec2-user

          key: ${{ secrets.EC2_SSH_KEY }}

          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION,ECR_REGISTRY

          script: |

            set -e


            echo "================================="
            echo "LEONI HSEE DEPLOYMENT"
            echo "================================="


            # ==================================================
            # CHECK AWS CREDENTIALS
            # ==================================================

            echo "Checking AWS credentials..."

            aws sts get-caller-identity


            # ==================================================
            # CHECK DOCKER
            # ==================================================

            echo "Checking Docker..."

            docker --version


            # ==================================================
            # CHECK AWS REGION
            # ==================================================

            echo "AWS Region: $AWS_REGION"

            echo "ECR Registry: $ECR_REGISTRY"


            # ==================================================
            # ECR LOGIN
            # ==================================================

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"


            echo "ECR login successful!"


            # ==================================================
            # APPLICATION DIRECTORY
            # ==================================================

            cd /home/ec2-user/leoni-hsee


            # ==================================================
            # PULL BACKEND
            # ==================================================

            echo "Pulling backend image..."

            docker pull \
              "$ECR_REGISTRY/leoni-hsee-backend:latest"


            # ==================================================
            # PULL FRONTEND
            # ==================================================

            echo "Pulling frontend image..."

            docker pull \
              "$ECR_REGISTRY/leoni-hsee-frontend:latest"


            # ==================================================
            # START POSTGRES
            # ==================================================

            echo "Starting PostgreSQL..."

            if docker compose version >/dev/null 2>&1; then

              docker compose \
                -f docker-compose.prod.yml \
                up -d postgres

            else

              docker-compose \
                -f docker-compose.prod.yml \
                up -d postgres

            fi


            # ==================================================
            # START BACKEND + FRONTEND
            # ==================================================

            echo "Starting backend and frontend..."

            if docker compose version >/dev/null 2>&1; then

              docker compose \
                -f docker-compose.prod.yml \
                up -d \
                --no-deps \
                --force-recreate \
                backend frontend

            else

              docker-compose \
                -f docker-compose.prod.yml \
                up -d \
                --no-deps \
                --force-recreate \
                backend frontend

            fi


            # ==================================================
            # CLEAN OLD IMAGES
            # ==================================================

            echo "Cleaning unused Docker images..."

            docker image prune -af


            # ==================================================
            # SHOW STATUS
            # ==================================================

            echo "================================="
            echo "CONTAINERS"
            echo "================================="

            docker ps


            echo "================================="
            echo "DEPLOYMENT COMPLETED"
            echo "================================="
